<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f7f7;color:#2b2622;font-family:Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:48px 24px;">
      <h1 style="margin:0 0 16px;font-size:28px;">Your DiasporaSpot sign-in link</h1>
      <p style="margin:0 0 24px;line-height:1.6;">
        Use the button below to securely sign in or create your free DiasporaSpot membership.
      </p>
      <a
        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
        style="display:inline-block;border-radius:999px;background:#2b2622;color:#f7f7f7;padding:14px 22px;text-decoration:none;font-weight:700;"
      >
        Continue to DiasporaSpot
      </a>
      <p style="margin:24px 0 0;color:#5a4f47;font-size:13px;line-height:1.6;">
        If you did not request this email, you can safely ignore it.
      </p>
    </div>
  </body>
</html>
